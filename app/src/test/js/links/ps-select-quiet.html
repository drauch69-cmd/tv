<!doctype html><html><head><style>
body{margin:0;font-family:sans-serif}
main{width:900px;margin:20px auto}
iframe{width:900px;height:500px;border:0;background:#000}
</style></head><body>
<main>
<select id="sourceSelect"><option value="0">Source 1 (alpha)</option><option value="1">Source 2 (beta)</option><option value="2">Source 3 (gamma)</option></select>
<iframe id="p" src="about:blank"></iframe>
</main>
<script>
document.getElementById('sourceSelect').addEventListener('change', function (e) {
  var v = e.target.value;
  document.getElementById('p').src = 'frame' + (parseInt(v, 10) + 1) + '.html';
  
});
</script></body></html>
