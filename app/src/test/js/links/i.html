<!doctype html><html><head><style>
body{margin:0;font-family:sans-serif;background:#111;color:#ccc}
header{position:fixed;top:0;left:0;right:0;height:60px;background:#222;display:flex;gap:16px;align-items:center;padding:0 20px}
header a{color:#fff}
main{max-width:1720px;margin:0 auto;padding:80px 32px 40px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px}
.box{grid-column:1;grid-row:1;background:#000;aspect-ratio:16/9;border:1px solid #333;display:flex;align-items:center;justify-content:center;font-size:13px;color:#999}
.left{grid-column:1;grid-row:2;display:flex;flex-direction:column;gap:24px}
.right{grid-column:2;grid-row:1 / span 2}
.right iframe{display:block;width:400px;height:680px;border:0}
.note{padding:10px;border-top:1px solid #333;border-bottom:1px solid #333;font-size:13px}
fieldset{border:1px solid #333;border-radius:10px;padding:12px;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.col{display:grid;grid-template-columns:1fr;gap:8px}
button{position:relative;display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 16px;background:#1f1f23;color:#fff;border:1px solid #333;border-radius:8px;font-size:12px;cursor:pointer}
.badge{position:absolute;top:-4px;left:-4px;min-width:18px;height:18px;font-size:10px;text-align:center;background:#112018;color:#4ade80;border-radius:9px}
footer{padding:20px;font-size:12px}
</style></head><body>
<header><a href="/">Home</a><a href="/a">Listings</a><a href="/b">Help</a></header>
<main>
<h1>Evening programme</h1>
<div class="cols">
 <div class="box"><div><span>Nothing is loaded here yet</span> <button type="button" style="display:inline-flex;width:auto">Go</button></div></div>
 <div class="left">
  <div class="note">A short tip about the picture settings.</div>
  <fieldset><legend>Tools</legend><div class="grid">
   <button type="button" aria-pressed="false">Mode</button><button type="button">Reload</button><button type="button" aria-pressed="false">Float</button><button type="button">Hide</button><button type="button">Wide</button>
  </div></fieldset>
  <fieldset><legend>Choices</legend><div class="col">
   <button type="button" aria-pressed="false"><span class="badge">1</span><span>Alpha one</span><span>icons</span></button>
   <button type="button" aria-pressed="false"><span class="badge">2</span><span>Beta two HD</span><span>icons</span></button>
   <button type="button" aria-pressed="false"><span class="badge">3</span><span>Gamma three</span><span>icons</span></button>
  </div></fieldset>
 </div>
 <div class="right"><section><iframe id="chat" src="about:blank"></iframe></section></div>
</div>
</main>
<footer>Small print</footer>
</body></html>
