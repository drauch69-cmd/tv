<!doctype html><html><head><style>
body{margin:0;font-family:sans-serif}
.wrap{position:fixed;inset:0;overflow:auto}
.player{position:sticky;top:0}
iframe{width:900px;height:500px;border:0;background:#000}
</style></head><body>
<div class="wrap">
<div class="player"><iframe id="p" src="about:blank"></iframe></div>
<select id="pick"><option value="0">One</option><option value="1">Two</option><option value="2">Three</option><option value="3">Four</option><option value="4">Five</option></select>
</div>
<script>
window.changes = 0;
document.getElementById('pick').addEventListener('change', function (e) {
  var v = e.target.value; window.changes++;
  setTimeout(function () {
    document.getElementById('p').src = 'frame' + (parseInt(v, 10) % 4 + 1) + '.html';
    history.replaceState(null, '', location.pathname + '?source=' + v);
  }, 300);
});
</script></body></html>
