<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The clean player's page loads nothing but its own two scripts; the stream itself is fetched
     by hls.js and answered natively by the app (see CleanPlayerActivity). -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; media-src blob:; connect-src http: https:; worker-src blob:; img-src data:; base-uri 'none'; form-action 'none'">
<title>StreamLink clean player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  video { position: fixed; left: 0; top: 0; width: 100%; height: 100%; background: #000; object-fit: contain; }
</style>
</head>
<body>
<video id="v" autoplay playsinline></video>
<script src="hls.min.js"></script>
<script src="clean.js"></script>
</body>
</html>
