<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>StreamLink</title>
<style>
  :root{--bg:#0d1220;--card:#162038;--line:#2c3a5c;--text:#e8edf8;--dim:#b8c4e0;--muted:#7f8dad;--accent:#4f8cff;--red:#ff4f5e}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);padding:20px 18px 40px;max-width:560px;margin:0 auto;-webkit-text-size-adjust:100%}
  h1{font-size:24px;margin:4px 0 16px}
  input,select{width:100%;font-size:17px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);-webkit-appearance:none;appearance:none}
  select{background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
  button{font-size:17px;padding:13px 10px;border:0;border-radius:12px;background:var(--card);color:var(--text);font-weight:600;border:1px solid var(--line);touch-action:manipulation}
  button:active{opacity:.7}
  button.primary{width:100%;margin-top:10px;background:var(--accent);border-color:var(--accent);color:#fff;font-size:19px}
  button.ghost{width:100%;background:transparent;color:var(--dim)}
  .status{margin:16px 2px;font-size:16px;color:var(--dim);min-height:22px}
  .card{background:#111a2e;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:8px}
  .now{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600;margin-bottom:14px;word-break:break-all}
  .badge{background:var(--red);color:#fff;font-size:12px;font-weight:700;padding:3px 7px;border-radius:6px;letter-spacing:.5px;flex:none}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid .wide{grid-column:1 / -1}
  label{display:block;margin-top:14px;font-size:14px;color:var(--muted)}
  label select{margin-top:6px}
  .after{margin-top:14px}
  details{margin-top:22px;background:#111a2e;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
  summary{font-size:17px;font-weight:600;cursor:pointer;color:var(--dim)}
  pre{white-space:pre-wrap;word-break:break-all;font-size:12px;line-height:1.45;color:var(--dim);background:var(--bg);border-radius:10px;padding:12px;max-height:50vh;overflow:auto;margin:12px 0}
  .foot{margin-top:26px;font-size:15px;text-align:center}
  a{color:var(--accent);text-decoration:none}
  [hidden]{display:none!important}
</style>
</head>
<body>
<h1>StreamLink</h1>

<form id="f">
  <input id="u" type="url" inputmode="url" placeholder="Paste a link" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button class="primary" type="submit">Play on TV</button>
</form>

<div id="status" class="status">Connecting to the TV…</div>

<section id="remote" class="card" hidden>
  <div class="now"><span id="title"></span><span id="live" class="badge" hidden>LIVE</span></div>
  <div class="grid">
    <button type="button" id="pp" data-c="toggle">Pause</button>
    <button type="button" id="livebtn" data-c="live">Jump to live</button>
    <button type="button" data-c="reload">Reconnect</button>
    <button type="button" data-c="stop">Stop</button>
  </div>
  <label id="qwrap" hidden>Quality
    <select id="quality"></select>
  </label>
  <label id="swrap" hidden>Source
    <select id="source"></select>
  </label>
  <div class="after">
    <button type="button" class="ghost" id="sitebtn" data-c="site">Use the site's own player</button>
  </div>
</section>

<details id="details">
  <summary>What happened?</summary>
  <pre id="report">Nothing yet.</pre>
  <div class="grid">
    <button type="button" id="refresh">Refresh</button>
    <button type="button" id="copy">Copy report</button>
  </div>
</details>

<p class="foot"><a href="/shortcut">Add “Play on TV” to your iPhone Share menu →</a></p>

<script>
(function(){
  function $(id){ return document.getElementById(id); }
  function post(path, body){
    return fetch(path, {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:body});
  }

  // Send a link
  $('f').onsubmit = function(e){
    e.preventDefault();
    var u = $('u').value.trim();
    if (!u) return;
    $('status').textContent = 'Sending…';
    post('/play', 'url=' + encodeURIComponent(u)).then(function(r){
      return r.text().then(function(t){
        $('status').textContent = t;
        if (r.ok) { $('u').value = ''; $('u').blur(); setTimeout(tick, 300); }
      });
    }).catch(function(){
      $('status').textContent = 'Could not reach the TV. Is StreamLink open?';
    });
  };

  // Remote buttons
  var buttons = document.querySelectorAll('[data-c]');
  for (var i = 0; i < buttons.length; i++) {
    (function(b){
      b.onclick = function(){ post('/cmd', 'c=' + encodeURIComponent(b.getAttribute('data-c'))).then(function(){ setTimeout(tick, 250); }); };
    })(buttons[i]);
  }
  $('quality').onchange = function(){ post('/cmd', 'c=quality&v=' + encodeURIComponent(this.value)).then(function(){ setTimeout(tick, 250); }); };
  $('source').onchange = function(){ post('/cmd', 'c=source&v=' + encodeURIComponent(this.value)).then(function(){ setTimeout(tick, 250); }); };

  // Only rebuild a dropdown when its options or current choice change,
  // so it doesn't snap shut while you're picking.
  function fill(sel, items, current, withAuto){
    var key = JSON.stringify(items) + '|' + current + '|' + withAuto;
    if (sel.getAttribute('data-k') === key) return;
    if (document.activeElement === sel) return;
    sel.setAttribute('data-k', key);
    sel.innerHTML = '';
    if (withAuto) {
      var a = document.createElement('option'); a.value = '-1'; a.textContent = 'Auto'; sel.appendChild(a);
    }
    for (var i = 0; i < items.length; i++) {
      var o = document.createElement('option'); o.value = String(i); o.textContent = items[i]; sel.appendChild(o);
    }
    sel.value = String(current);
  }

  var failures = 0;
  function tick(){
    fetch('/state', {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(s){
      failures = 0;
      $('status').textContent = s.status || '';
      var player = s.mode === 'player', site = s.mode === 'site';
      $('remote').hidden = !(player || site);
      if (!(player || site)) return;
      $('title').textContent = s.title || '';
      $('live').hidden = !(player && s.live);
      $('pp').textContent = player ? (s.playing ? 'Pause' : 'Play') : 'Play / Pause';
      $('livebtn').hidden = !player;
      $('sitebtn').hidden = !player;
      var q = s.qualities || [], src = s.sources || [];
      $('qwrap').hidden = !(player && q.length > 1);
      $('swrap').hidden = !(player && src.length > 1);
      if (player) {
        fill($('quality'), q, typeof s.quality === 'number' ? s.quality : -1, true);
        fill($('source'), src, typeof s.source === 'number' ? s.source : 0, false);
      }
    }).catch(function(){
      failures++;
      if (failures >= 2) $('status').textContent = 'Lost connection to the TV.';
    });
  }

  // What happened? report
  function loadReport(){
    $('report').textContent = 'Loading…';
    fetch('/report', {cache:'no-store'}).then(function(r){ return r.text(); }).then(function(t){
      $('report').textContent = t || 'Nothing yet.';
    }).catch(function(){ $('report').textContent = 'Could not reach the TV.'; });
  }
  $('details').addEventListener('toggle', function(){ if (this.open) loadReport(); });
  $('refresh').onclick = loadReport;
  $('copy').onclick = function(){
    var t = $('report').textContent;
    var btn = $('copy');
    function done(){ btn.textContent = 'Copied ✓'; setTimeout(function(){ btn.textContent = 'Copy report'; }, 1500); }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(t).then(done, fallback);
      return;
    }
    fallback();
    function fallback(){
      var ta = document.createElement('textarea');
      ta.value = t;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.left = '0'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      try { ta.setSelectionRange(0, t.length); } catch (e) {}
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      if (ok) done(); else btn.textContent = 'Select the text to copy';
    }
  };

  tick();
  setInterval(tick, 1500);
})();
</script>
</body>
</html>
