name: Lint

on:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Android lint
        run: gradle :app:lintDebug --no-daemon -q || true

      - name: Kotlin style (ktlint)
        run: |
          curl -sSL -o ktlint https://github.com/pinterest/ktlint/releases/download/1.3.1/ktlint
          chmod +x ktlint
          ./ktlint "app/src/**/*.kt" --reporter=plain > ktlint.txt 2>&1 || true

      - name: Print reports
        run: |
          echo "===== ANDROID LINT ====="
          cat app/build/reports/lint-results.txt || echo "(no android lint report)"
          echo "===== KTLINT ====="
          cat ktlint.txt
          echo "===== END ====="
