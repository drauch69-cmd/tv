name: Build APK

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "cleaner/**"
      - ".github/workflows/cleaner.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # Branch "test" builds a separate app (StreamLink Test, com.streamlink.tv.test) that installs
      # next to the normal one. Every other branch builds the normal app.
      - name: Pick build channel
        run: |
          if [ "$GITHUB_REF" = "refs/heads/test" ]; then
            echo "STREAMLINK_CHANNEL=test" >> "$GITHUB_ENV"
            echo "APK_NAME=StreamLink-Test.apk" >> "$GITHUB_ENV"
          else
            echo "STREAMLINK_CHANNEL=main" >> "$GITHUB_ENV"
            echo "APK_NAME=StreamLink.apk" >> "$GITHUB_ENV"
          fi

      # hls.js (Apache-2.0) for the clean browser player. Pinned; fetched here instead of being
      # committed, then bundled into the APK's assets by the build below.
      - name: Fetch hls.js
        run: |
          set -e
          HLS_VERSION=1.6.13
          mkdir -p "$RUNNER_TEMP/hls"
          cd "$RUNNER_TEMP/hls"
          npm pack "hls.js@$HLS_VERSION" --silent
          tar -xzf "hls.js-$HLS_VERSION.tgz"
          cp package/dist/hls.min.js "$GITHUB_WORKSPACE/app/src/main/assets/hls.min.js"
          cp package/LICENSE "$GITHUB_WORKSPACE/app/src/main/assets/hls.js.LICENSE.txt"
          echo "$HLS_VERSION" > "$GITHUB_WORKSPACE/app/src/main/assets/hls.js.VERSION.txt"
          ls -l "$GITHUB_WORKSPACE/app/src/main/assets/"

      - name: Build
        run: |
          set -o pipefail
          gradle testReleaseUnitTest assembleRelease --no-daemon --console=plain > build.log 2>&1 || {
            echo "===== BUILD FAILED: errors ====="
            grep -E "^e: |error:|warning:.*deprecated.*error|FAILED|What went wrong|AssertionError|Expected|expected:|\.java:[0-9]+|\.kt:[0-9]+" build.log | head -80
            echo "===== last 60 lines ====="
            tail -60 build.log
            exit 1
          }
          grep -E "BUILD SUCCESSFUL|tests completed" build.log || true

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"

      # Machine-readable version of this build; the app's updater reads it from the release.
      - name: Write version.json
        run: |
          SHA=$(sha256sum "$APK_NAME" | cut -d' ' -f1)
          printf '{"versionCode": %s, "channel": "%s", "apk": "%s", "sha256": "%s"}\n' \
            "$GITHUB_RUN_NUMBER" "$STREAMLINK_CHANNEL" "$APK_NAME" "$SHA" > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.STREAMLINK_CHANNEL == 'test' && 'StreamLink-Test-apk' || 'StreamLink-apk' }}
          path: ${{ env.APK_NAME }}

      # Also publish it as a "latest" release, so the TV can download it from one fixed link.
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest StreamLink.apk version.json --title "Latest build" --notes "Build ${{ github.run_number }}"

      # Branch "test" publishes the separate test app to its own fixed link.
      - name: Publish test release
        if: github.ref == 'refs/heads/test'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-latest --yes --cleanup-tag || true
          gh release create test-latest StreamLink-Test.apk version.json --title "Test build" --notes "Test build ${{ github.run_number }}"

      # Android Lint report. Runs after build/test and publishing so it can never block them.
      - name: Android Lint
        if: always()
        continue-on-error: true
        run: |
          gradle :app:lintDebug --no-daemon --console=plain > lint.log 2>&1 || tail -40 lint.log
          ls -l app/build/reports/ || true
          echo "===== LINT SUMMARY ====="
          grep -E "[0-9]+ errors?, [0-9]+ warnings?" app/build/reports/lint-results.txt || true
          grep -E "^(Error|Warning):|^[^ ]+:[0-9]+: (Error|Warning)" app/build/reports/lint-results.txt | sed -E 's/.*\[([A-Za-z]+)\]$/\1/' | sort | uniq -c | sort -rn || true
          echo "===== LINT TEXT REPORT ====="
          cat app/build/reports/lint-results.txt || true

      - name: Upload lint report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results*
          if-no-files-found: warn
    permissions:
      contents: write
