name: Build APK

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "cleaner/**"
      - ".github/workflows/cleaner.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # hls.js (Apache-2.0) for the clean browser player. Pinned; fetched here instead of being
      # committed, then bundled into the APK's assets by the build below.
      - name: Fetch hls.js
        run: |
          set -e
          HLS_VERSION=1.6.13
          mkdir -p "$RUNNER_TEMP/hls"
          cd "$RUNNER_TEMP/hls"
          npm pack "hls.js@$HLS_VERSION" --silent
          tar -xzf "hls.js-$HLS_VERSION.tgz"
          cp package/dist/hls.min.js "$GITHUB_WORKSPACE/app/src/main/assets/hls.min.js"
          cp package/LICENSE "$GITHUB_WORKSPACE/app/src/main/assets/hls.js.LICENSE.txt"
          echo "$HLS_VERSION" > "$GITHUB_WORKSPACE/app/src/main/assets/hls.js.VERSION.txt"
          ls -l "$GITHUB_WORKSPACE/app/src/main/assets/"

      - name: Build
        run: |
          set -o pipefail
          gradle testReleaseUnitTest assembleRelease --no-daemon --console=plain > build.log 2>&1 || {
            echo "===== BUILD FAILED: errors ====="
            grep -E "^e: |error:|warning:.*deprecated.*error|FAILED|What went wrong|AssertionError|Expected|expected:|\.java:[0-9]+|\.kt:[0-9]+" build.log | head -80
            echo "===== last 60 lines ====="
            tail -60 build.log
            exit 1
          }
          grep -E "BUILD SUCCESSFUL|tests completed" build.log || true

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk StreamLink.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StreamLink-apk
          path: StreamLink.apk

      # Also publish it as a "latest" release, so the TV can download it from one fixed link.
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest StreamLink.apk --title "Latest build" --notes "Build ${{ github.run_number }}"
    permissions:
      contents: write
