name: Build APK

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "cleaner/**"
      - ".github/workflows/cleaner.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # Branch "test" builds a separate app (StreamLink Test, com.streamlink.tv.test) and branch "sports"
      # another (StreamLink Sports, com.streamlink.tv.sports); both install next to the normal one.
      # Every other branch builds the normal app.
      - name: Pick build channel
        run: |
          if [ "$GITHUB_REF" = "refs/heads/test" ]; then
            echo "STREAMLINK_CHANNEL=test" >> "$GITHUB_ENV"
            echo "APK_NAME=StreamLink-Test.apk" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF" = "refs/heads/sports" ]; then
            echo "STREAMLINK_CHANNEL=sports" >> "$GITHUB_ENV"
            echo "APK_NAME=StreamLink-Sports.apk" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF" = "refs/heads/lab" ]; then
            echo "STREAMLINK_CHANNEL=lab" >> "$GITHUB_ENV"
            echo "APK_NAME=StreamLink-Lab.apk" >> "$GITHUB_ENV"
          else
            echo "STREAMLINK_CHANNEL=main" >> "$GITHUB_ENV"
            echo "APK_NAME=StreamLink.apk" >> "$GITHUB_ENV"
          fi

      # hls.js (Apache-2.0) for the clean browser player. Pinned; fetched here instead of being
      # committed, then bundled into the APK's assets by the build below.
      - name: Fetch hls.js
        run: |
          set -e
          HLS_VERSION=1.6.13
          mkdir -p "$RUNNER_TEMP/hls"
          cd "$RUNNER_TEMP/hls"
          npm pack "hls.js@$HLS_VERSION" --silent
          tar -xzf "hls.js-$HLS_VERSION.tgz"
          cp package/dist/hls.min.js "$GITHUB_WORKSPACE/app/src/main/assets/hls.min.js"
          cp package/LICENSE "$GITHUB_WORKSPACE/app/src/main/assets/hls.js.LICENSE.txt"
          echo "$HLS_VERSION" > "$GITHUB_WORKSPACE/app/src/main/assets/hls.js.VERSION.txt"
          ls -l "$GITHUB_WORKSPACE/app/src/main/assets/"

      # Release signing key from Actions secrets (moved out of the repo 2026-11-20).
      - name: Signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          set -e
          if [ -z "$SIGNING_KEYSTORE_B64" ]; then echo "SIGNING_KEYSTORE_B64 secret is missing"; exit 1; fi
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.keystore"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/signing.keystore" >> "$GITHUB_ENV"

      - name: Build
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          set -o pipefail
          gradle testReleaseUnitTest assembleRelease --no-daemon --console=plain > build.log 2>&1 || {
            echo "===== BUILD FAILED: errors ====="
            grep -E "^e: |error:|warning:.*deprecated.*error|FAILED|What went wrong|AssertionError|Expected|expected:|\.java:[0-9]+|\.kt:[0-9]+" build.log | head -80
            echo "===== last 60 lines ====="
            tail -60 build.log
            exit 1
          }
          grep -E "BUILD SUCCESSFUL|tests completed" build.log || true

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"

      # The TV only accepts updates signed with the same certificate: stop before publishing if it changed.
      - name: Check signing certificate
        run: |
          set -e
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$SIGNER" verify --print-certs "$APK_NAME" | tee signer.txt
          grep -qi "SHA-256 digest: e0a53bad720869304e2c872c4bcd0c8d2df0cdbe69986f9d201f3fd286c24abb" signer.txt || {
            echo "Signing certificate changed: the TV would refuse this update"; exit 1; }

      # Machine-readable version of this build; the app's updater reads it from the release.
      - name: Write version.json
        run: |
          SHA=$(sha256sum "$APK_NAME" | cut -d' ' -f1)
          printf '{"versionCode": %s, "channel": "%s", "apk": "%s", "sha256": "%s"}\n' \
            "$GITHUB_RUN_NUMBER" "$STREAMLINK_CHANNEL" "$APK_NAME" "$SHA" > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.STREAMLINK_CHANNEL == 'test' && 'StreamLink-Test-apk' || env.STREAMLINK_CHANNEL == 'sports' && 'StreamLink-Sports-apk' || env.STREAMLINK_CHANNEL == 'lab' && 'StreamLink-Lab-apk' || 'StreamLink-apk' }}
          path: ${{ env.APK_NAME }}

      # Also publish it as a "latest" release, so the TV can download it from one fixed link.
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest StreamLink.apk version.json --title "Latest build" --notes "Build ${{ github.run_number }}"

      # Branch "test" publishes the separate test app to its own fixed link.
      - name: Publish test release
        if: github.ref == 'refs/heads/test'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-latest --yes --cleanup-tag || true
          gh release create test-latest StreamLink-Test.apk version.json --title "Test build" --notes "Test build ${{ github.run_number }}"

      # Branch "sports" publishes the separate sports app to its own fixed link.
      - name: Publish sports release
        if: github.ref == 'refs/heads/sports'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete sports-latest --yes --cleanup-tag || true
          gh release create sports-latest StreamLink-Sports.apk version.json --title "Sports build" --notes "Sports build ${{ github.run_number }}"
          # 2026-11-22: GitHub once left this release as a draft (the TV then gets 404). Make sure it is public.
          for i in 1 2 3; do
            [ "$(gh release view sports-latest --json isDraft -q .isDraft)" = "false" ] && break
            echo "Release is still a draft; publishing it (try $i)"
            gh release edit sports-latest --draft=false || true
            sleep 5
          done
          [ "$(gh release view sports-latest --json isDraft -q .isDraft)" = "false" ] || { echo "Release sports-latest is still a draft"; exit 1; }
          curl -sfL -o /dev/null "https://github.com/${{ github.repository }}/releases/download/sports-latest/version.json" || { echo "version.json not downloadable"; exit 1; }

      # Branch "lab" publishes the Lab app (big redesigns, installs next to Sports) to its own fixed link.
      - name: Publish lab release
        if: github.ref == 'refs/heads/lab'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete lab-latest --yes --cleanup-tag || true
          gh release create lab-latest StreamLink-Lab.apk version.json --title "Lab build" --notes "Lab build ${{ github.run_number }}"
          # 2026-11-22: GitHub once left this release as a draft (the TV then gets 404). Make sure it is public.
          for i in 1 2 3; do
            [ "$(gh release view lab-latest --json isDraft -q .isDraft)" = "false" ] && break
            echo "Release is still a draft; publishing it (try $i)"
            gh release edit lab-latest --draft=false || true
            sleep 5
          done
          [ "$(gh release view lab-latest --json isDraft -q .isDraft)" = "false" ] || { echo "Release lab-latest is still a draft"; exit 1; }
          curl -sfL -o /dev/null "https://github.com/${{ github.repository }}/releases/download/lab-latest/version.json" || { echo "version.json not downloadable"; exit 1; }

      # Android Lint report. Runs after build/test and publishing so it can never block them.
      - name: Android Lint
        if: always()
        continue-on-error: true
        run: |
          gradle :app:lintDebug --no-daemon --console=plain > lint.log 2>&1 || tail -40 lint.log
          ls -l app/build/reports/ || true
          echo "===== LINT SUMMARY ====="
          grep -E "[0-9]+ errors?, [0-9]+ warnings?" app/build/reports/lint-results.txt || true
          grep -E "^(Error|Warning):|^[^ ]+:[0-9]+: (Error|Warning)" app/build/reports/lint-results.txt | sed -E 's/.*\[([A-Za-z]+)\]$/\1/' | sort | uniq -c | sort -rn || true
          echo "===== LINT TEXT REPORT ====="
          cat app/build/reports/lint-results.txt || true

      - name: Upload lint report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results*
          if-no-files-found: warn
    permissions:
      contents: write
