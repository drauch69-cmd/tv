name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build
        run: gradle testReleaseUnitTest assembleRelease --no-daemon -i 2>&1 | grep -E "LinkServerTest|HTTP/1.1|BUILD|FAIL|e: " ; exit ${PIPESTATUS[0]}

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk StreamLink.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StreamLink-apk
          path: StreamLink.apk

      # Also publish it as a "latest" release, so the TV can download it from one fixed link.
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest StreamLink.apk --title "Latest build" --notes "Build ${{ github.run_number }}"
    permissions:
      contents: write
