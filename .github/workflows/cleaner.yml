name: Build TV Cleaner

on:
  push:
    branches: [main]
    paths:
      - "cleaner/**"
      - ".github/workflows/cleaner.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build
        run: |
          set +e
          gradle -p cleaner testReleaseUnitTest assembleRelease --no-daemon > build.log 2>&1
          code=$?
          # Surface compiler errors and failed tests as annotations.
          grep -E "^e: " build.log | head -20 | sed 's/^/::error::/'
          grep -E "FAILED|AssertionError|expected:" build.log | head -20 | sed 's/^/::error::/'
          grep -A8 "What went wrong" build.log | head -20 | tr '\n' ' ' | sed 's/^/::error::/'; echo
          tail -40 build.log
          exit $code

      - name: Lint (Android lint and ktlint)
        run: |
          gradle -p cleaner lintRelease --no-daemon -q || true
          cp cleaner/app/build/reports/lint.txt lint.txt || echo "(no lint report)" > lint.txt
          curl -sSL -o ktlint https://github.com/pinterest/ktlint/releases/download/1.3.1/ktlint
          chmod +x ktlint
          ./ktlint "cleaner/app/src/**/*.kt" --reporter=plain > ktlint.txt 2>&1 || true
          echo "Android lint: $(grep -cE ': (Error|Warning):' lint.txt) issues; ktlint: $(grep -c '\.kt:' ktlint.txt) issues"

      - name: Rename APK
        run: cp cleaner/app/build/outputs/apk/release/app-release.apk TVCleaner.apk

      - uses: actions/upload-artifact@v5
        with:
          name: TVCleaner-apk
          path: TVCleaner.apk

      # A fixed download link for the TV: .../releases/download/cleaner-latest/TVCleaner.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete cleaner-latest --yes --cleanup-tag || true
          # Deleting the old tag can take a moment to settle, so try a few times.
          for i in 1 2 3 4 5; do
            if gh release create cleaner-latest TVCleaner.apk lint.txt ktlint.txt \
                --target "${{ github.sha }}" --title "TV Cleaner (latest build)" \
                --notes "Build ${{ github.run_number }}" --latest=false; then
              exit 0
            fi
            sleep 10
          done
          exit 1
